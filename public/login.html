<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SWaGi InTech... | Super Admin Login</title>

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>SWaGi InTech...</h1>

        <p class="tagline">
            Transforming Ideas into Inventions and Innovations.
        </p>

        <h2>Super Admin Login</h2>

        <form id="loginForm">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email or Phone Number"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p class="forgot-password">
    <a href="/forgot-password.html">
        Forgot Password?
    </a>
</p>

        </form>

        <p id="message"></p>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
