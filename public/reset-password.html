<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SWaGi InTech... | Reset Password</title>

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>SWaGi InTech...</h1>

        <p class="tagline">
            Transforming ideas into inventions and innovations.
        </p>

        <h2>Create New Password</h2>

        <form id="resetPasswordForm">

            <label>New Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter new password"
    required
>

<label>Confirm Password</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm new password"
    required
>

            <button type="submit">
                Reset Password
            </button>

            <p class="forgot-password">
    <a href="/forgot-password.html">
        Forgot Password?
    </a>
</p>

        </form>

        <p id="message"></p>

    </div>

</div>

<script src="js/reset-password.js"></script>

</body>

</html>
